name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened,synchronize,reopened]

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

    name: Node.js ${{ matrix.node-version}} - Test Suite
    steps:
      - uses: actions/checkout@v4

      - name: Set up cache
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-${{ hashFiles('package-lock.json') }}

      - name: Setup Node.js ${{ matrix.node-version}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - name: Run tests
        env:
          CI: true
        run: |
          set +e # ignore exit code 0/1 for running linter and formatter in CI context
